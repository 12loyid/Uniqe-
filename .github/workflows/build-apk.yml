name: Build Unique Design APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check files
        run: |
          echo "Root files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 2 -type f \( -name "gradlew" -o -name "build.gradle*" -o -name "settings.gradle*" \) -print

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unique-Design-APK
          path: "**/build/outputs/apk/**/*.apk" 
